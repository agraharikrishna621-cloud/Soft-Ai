<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#0f1117;color:#e8e8ea;font-family:system-ui,sans-serif}
header{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #23262f}
.logo{width:34px;height:34px;border-radius:50%;background:#6c8cff;display:grid;place-items:center;font-weight:700}
header b{flex:1}
header button{background:none;border:0;color:#8a8f9c;font-size:20px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.45}
.bot{background:#1c1f28;align-self:flex-start}
.me{background:#4a64d8;align-self:flex-end}
form{display:flex;gap:8px;padding:10px;border-top:1px solid #23262f}
input{flex:1;padding:12px 14px;border-radius:22px;border:1px solid #2c303b;background:#171a22;color:#fff;font-size:16px}
form button{border:0;border-radius:22px;padding:0 18px;background:#6c8cff;color:#fff;font-size:16px}
</style>
</head>
<body>
<header><div class="logo">S</div><b>Soft AI</b><button id="key">⚙️</button></header>
<div id="chat"></div>
<form id="f"><input id="t" placeholder="Message likho..." autocomplete="off"><button>Bhejo</button></form>
<script>
const chat=document.getElementById('chat'),f=document.getElementById('f'),t=document.getElementById('t');
let hist=[];
function add(text,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function getKey(force){let k=localStorage.getItem('gkey');if(!k||force){k=prompt('Apni Gemini API key paste karo:');if(k)localStorage.setItem('gkey',k.trim())}return k}
document.getElementById('key').onclick=()=>getKey(true);
add('Welcome to Soft AI by Krishna — What can I do for you?','bot');
f.onsubmit=async e=>{
  e.preventDefault();
  const q=t.value.trim();if(!q)return;
  const k=getKey();if(!k)return;
  t.value='';add(q,'me');
  hist.push({role:'user',parts:[{text:q}]});
  const w=add('...','bot');
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify({contents:hist})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error&&j.error.message||'Error');
    const a=j.candidates[0].content.parts.map(p=>p.text||'').join('');
    w.textContent=a;hist.push({role:'model',parts:[{text:a}]});
  }catch(err){w.textContent='Error: '+err.message;hist.pop()}
  chat.scrollTop=chat.scrollHeight;
};
</script>
</body>
</html>
